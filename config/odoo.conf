[options]
; Đường dẫn đến các addons (thêm cả addons mặc định của Odoo nếu cần)
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Thư mục lưu trữ dữ liệu (filestore, logs, …)
data_dir = /var/lib/odoo

; Mật khẩu admin (bắt buộc đặt lại mật khẩu mặc định để bảo mật)
admin_passwd = mysupersecret

; Các thiết lập CSV
csv_internal_sep = ,

; Số kết nối tối đa đến cơ sở dữ liệu
db_maxconn = 64

; Sử dụng mẫu cơ sở dữ liệu (template1 thường dùng mặc định)
db_template = template1

; Lọc cơ sở dữ liệu theo tên (ở đây là ví dụ cho môi trường đơn database)
dbfilter = ^%d$

; Chế độ debug (False cho môi trường production)
debug_mode = False

; Email gửi mặc định (có thể thay đổi nếu cần gửi mail từ Odoo)
email_from = no-reply@mydomain.com

; Giới hạn bộ nhớ cho các worker
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

; Giới hạn số request và thời gian xử lý
limit_request = 8192
limit_time_cpu = 60
limit_time_real = 120

; Cho phép hiển thị danh sách cơ sở dữ liệu (nên đặt False trong production)
list_db = True

; Cài đặt log
log_db = False
log_handler = [':INFO']
log_level = info
logfile = /var/log/odoo/odoo.log

; Cổng cho longpolling (nếu sử dụng tính năng live chat, …)
longpolling_port = 8072

; Số luồng cron tối đa
max_cron_threads = 2

; Giới hạn bộ nhớ cho ORM (các giá trị mặc định)
osv_memory_age_limit = 1.0
osv_memory_count_limit = False

; Cài đặt SMTP (nếu sử dụng để gửi mail)
smtp_server = localhost
smtp_port = 25
smtp_ssl = False
smtp_user = False
smtp_password = False

; Số lượng worker (0: sử dụng multi-threading; >0: dùng multi-process cho production)
workers = 0

; Cấu hình cho XML-RPC (HTTP giao tiếp)
xmlrpc = True
xmlrpc_interface =
xmlrpc_port = 8069

; Cấu hình cho XML-RPC Secure (HTTPS giao tiếp)
xmlrpcs = True
xmlrpcs_interface =
xmlrpcs_port = 8071
